name: CI/CD Pipeline Conduit Container

on:

  push:
    branches: [ "featurebranch/deployment" ]

  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  Test:

    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./conduit-container

    steps:

      - name: Checkout repository
        uses: actions/checkout@v7
        with: 
          submodules: true

      - name: Build environment
        run: cp .env.example .env

      - name: Run conduit container compose
        run: docker compose -f docker-compose.yml up -d

      - name: Check if conduit container is running
        run: docker compose ps
      
      - name: Check if website is running
        run: curl --fail --retry 10 --retry-delay 3 http://localhost:8282

      - name: Show logs if test fails
        if: failure()
        run: docker compose -f docker-compose.yml logs

      - name: Stop test containers
        if: always()
        run: docker compose -f docker-compose.yml down
    
  deploy:
    name: Deployment
    runs-on: ubuntu-latest
    needs: Test

    steps:
      - name: Deploy to V-Server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            set -e

            cd ~/conduit-container

            BRANCH=$(git branch --show-current)

            if [ "$BRANCH" != "main" ]; then
              git checkout main
            fi
            
            git pull 
            git submodule update --init

            docker compose down
            docker compose up -d --build
